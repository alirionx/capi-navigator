# Release: a tag vX.Y.Z publishes the container image ghcr.io/<owner>/capi-navigator:X.Y.Z, pushes
# the Helm chart as OCI artifact to ghcr.io/<owner>/charts/capi-navigator:X.Y.Z and attaches the
# packaged chart (capi-navigator-X.Y.Z.tgz + .sha256) to the GitHub release. The chart of the
# manifest add-ons (capi-navigator-manifests, FP-30) is released the same way with the same version.
#
# To release: set `version` and `appVersion` in deploy/helm/capi-navigator/Chart.yaml to X.Y.Z,
# commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Releases run one after another, never in parallel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART: deploy/helm/capi-navigator
  MANIFESTS_CHART: deploy/helm/capi-navigator-manifests

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Chart.yaml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart="$(awk '/^version:/ {print $2}' "$CHART/Chart.yaml")"
          app="$(awk '/^appVersion:/ {print $2}' "$CHART/Chart.yaml")"
          if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Chart.yaml (version $chart, appVersion $app)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=capi-navigator
            org.opencontainers.image.description=A lean web UI for Cluster API
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    # The release appears only once its image exists.
    needs: [version, image]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and package
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          helm lint "$CHART" --strict
          helm lint "$MANIFESTS_CHART" --strict
          mkdir -p dist
          helm package "$CHART" --destination dist
          # Same version as the app (FP30-F-01); its Chart.yaml stays at 0.0.0-dev.
          helm package "$MANIFESTS_CHART" --destination dist --version "$VERSION" --app-version "$VERSION"
          (cd dist && for f in *.tgz; do sha256sum "$f" > "$f.sha256"; done)
          echo "file=dist/capi-navigator-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
      # Next to the container image, under charts/ (same name would clash with the image). A new
      # package starts private: set it to public once in the package settings, like the image.
      # Workload clusters pull capi-navigator-manifests through CAAPH, so it must be public too.
      - name: Push charts to ghcr.io (OCI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for file in dist/*.tgz; do
            helm push "$file" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          chart="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/capi-navigator"
          cat > notes.md <<NOTES
          Container image: \`${IMAGE}:${VERSION}\`

          Install the Helm chart from ghcr.io:

          \`\`\`sh
          helm install capi-navigator ${chart} --version ${VERSION} \\
            -n capi-navigator-system --create-namespace
          \`\`\`

          Upgrading: Helm does not update CRDs on \`helm upgrade\`; apply them first:

          \`\`\`sh
          helm show crds ${chart} --version ${VERSION} | kubectl apply --server-side -f -
          helm upgrade capi-navigator ${chart} --version ${VERSION} \\
            -n capi-navigator-system --reuse-values
          \`\`\`

          The packaged chart is also attached to this release (\`${base}/$(basename "$FILE")\`).

          Manifest add-ons (FP-30) use the chart \`${chart}-manifests\` with the same version.

          See the README for exposure options (Service, Ingress, HTTPRoute) and all values.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*.sha256 \
            --title "CAPI Navigator ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
