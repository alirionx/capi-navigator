# FP0-F-05: lint, typecheck, tests and image build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @capi-navigator/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    # NF-16: integration tests against a kind cluster.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm kind:up --bare
      - run: pnpm test:int

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: capi-navigator:ci
          build-args: APP_VERSION=${{ github.sha }}
