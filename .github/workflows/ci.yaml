# FP0-F-05: lint, typecheck, tests and image build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @capi-navigator/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # FP20-F-07: development scripts and the node script templates (preinstalled on the runner).
      - name: shellcheck
        run: shellcheck -S warning -x scripts/*.sh packages/shared/src/cluster/templates/*.sh.tmpl
      - name: Helm chart (lint and render all exposure options)
        run: |
          helm lint deploy/helm/capi-navigator
          helm template t deploy/helm/capi-navigator --set service.type=LoadBalancer \
            --set ingress.enabled=true --set 'ingress.hosts[0]=a.example.com' \
            --set httpRoute.enabled=true --set 'httpRoute.parentRefs[0].name=gw' > /dev/null
      - run: pnpm test:coverage

  integration:
    # NF-16: integration tests against a kind cluster.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Full setup: the FP-3 and FP-4 tests install providers through the CAPI Operator.
      - run: pnpm kind:up
      - run: pnpm test:int

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: capi-navigator:ci
          build-args: APP_VERSION=${{ github.sha }}
      # Files outside dist/ reach the image only through "files" in apps/backend/package.json.
      - name: Image contains the backend assets (Calico manifest, Swagger UI)
        run: |
          docker run --rm --entrypoint node capi-navigator:ci -e "
            await (await import('/app/dist/clusters/cni-manifest.js')).calicoManifest();
            const fs = await import('node:fs');
            for (const f of ['/app/assets/swagger-ui/index.html', '/app/assets/swagger-ui/init.js'])
              if (!fs.existsSync(f)) throw new Error('missing ' + f);
          " --input-type=module
