# versions.yaml — every version CAPI Navigator pins (FP-20, ADR-0018).
#
# The only place to change a version. `pnpm versions:generate` validates this file and turns it
# into packages/shared/src/versions.generated.ts, which the app imports; the app never reads this
# file at runtime. `pnpm versions:report` shows newer versions in docs/versions-report.md.
# How to update a version: docs/maintenance.md.
#
# Every entry has:
#   version  the pinned version, exactly as the upstream project tags it
#   source   where newer versions come from:
#              datasource  github-releases | helm | docker
#              package     GitHub repository, chart name or image name
#              registry    Helm repository URL or container registry (helm, docker only)
#   verified when the version was last checked against its upstream (docs, CRDs, live test)
#   note     optional: couplings and caveats

schemaVersion: 1

# ---- Cluster API providers (installed through the CAPI Operator, FP-3) ---------------------------
providers:
  cluster-api:
    # One release for core, kubeadm bootstrap and kubeadm control plane.
    version: v1.14.3
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api
    verified: 2026-10-17
    note: CAPI contract v1beta2.
  rke2:
    # One release for the RKE2 bootstrap and control plane providers.
    version: v0.27.0
    source:
      datasource: github-releases
      package: rancher/cluster-api-provider-rke2
    verified: 2026-10-20
    note: >-
      v0.27.0 was taken one day after its release, before the minimum release age, to test the
      update and rollback procedure. No API changes from v0.26.0; built on CAPI v1.14.3.
  k0smotron:
    # One release for the k0smotron bootstrap and control plane providers.
    version: v2.3.0
    source:
      datasource: github-releases
      package: k0sproject/k0smotron
    verified: 2026-10-20
    note: >-
      v2.3.0 taken on its release day for ADR-0013: control plane replacement works live for one
      node; three nodes are all removed at once (etcd on one member for minutes), so they stay
      blocked. Re-test multi-node replacement with every release. The deprecated `version` of the
      worker config is still honoured.
  openstack:
    version: v0.15.0
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api-provider-openstack
    verified: 2026-10-17
    note: Needs the ORC version of its minor (prerequisites.orc).
  aws:
    version: v2.13.1
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api-provider-aws
    verified: 2026-10-17
  gcp:
    # Cluster API provider for Google Cloud (CAPG, FP-25).
    version: v1.13.1
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api-provider-gcp
    verified: 2026-10-20
    note: >-
      Still implements the v1beta1 contract (built against CAPI v1.13.2). CAPI v1.14 supports it;
      CAPI plans to drop v1beta1 contract support with v1.16 (tentatively April 2027), so CAPG
      must move to v1beta2 before core can go there.
  proxmox:
    # Cluster API provider for Proxmox VE (CAPMOX, FP-31, ADR-0027).
    version: v0.9.1
    source:
      datasource: github-releases
      package: ionos-cloud/cluster-api-provider-proxmox
    verified: 2026-10-23
    note: >-
      API v1alpha2, contract v1beta2. Upstream lists CAPI v1.11/v1.12; verified live with CAPI
      v1.14.3 (RKE2 and k0s, FP-31 spike). Skips TLS verification unless PROXMOX_INSECURE=false.
  ipam-in-cluster:
    # In-cluster IPAM provider; CAPMOX takes node addresses from it (FP-31).
    version: v1.1.1
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api-ipam-provider-in-cluster
    verified: 2026-10-23
    note: >-
      Contract v1beta2 from v1.1. Holds released addresses for a grace period before reuse.
  helm:
    # Cluster API Add-on Provider for Helm (CAAPH, FP-8).
    version: v0.6.4
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api-addon-provider-helm
    verified: 2026-10-17

# ---- Prerequisites on a management cluster (FP-3) -----------------------------------------------
prerequisites:
  cert-manager:
    version: v1.21.2
    source:
      datasource: github-releases
      package: cert-manager/cert-manager
    verified: 2026-10-17
    note: Install command uses the Helm chart oci://quay.io/jetstack/charts/cert-manager with this version.
  capi-operator:
    version: v0.30.0
    source:
      datasource: github-releases
      package: kubernetes-sigs/cluster-api-operator
    verified: 2026-10-20
    note: >-
      The Helm chart version is this version without the leading "v". v0.30.0 taken on its release
      day together with k0smotron v2.3.0; no API changes.
  orc:
    # ORC per CAPO minor: the ORC module version CAPO is built against (its go.mod).
    source:
      datasource: github-releases
      package: k-orc/openstack-resource-controller
    verified: 2026-10-17
    byCapoMinor:
      v0.15: v2.6.0
      v0.14: v2.4.0
      v0.13: v2.3.0

# ---- Kubernetes versions offered per distribution (FP3-F-07a, wizard and upgrades) --------------
# One entry per Kubernetes minor (latest patch). verifiedWithProvider: provider version the entry
# was checked with; untested: supported by CAPI and the provider, newer than the provider's e2e.
kubernetes:
  rke2:
    source:
      datasource: github-releases
      package: rancher/rke2
    verified: 2026-10-20
    note: Latest patch per minor from the rancher/rke2 releases. The RKE2 provider runs its e2e tests with Kubernetes v1.35.
    versions:
      - { version: v1.37.1+rke2r1, verifiedWithProvider: v0.27.0, untested: true }
      - { version: v1.36.5+rke2r1, verifiedWithProvider: v0.27.0, untested: true }
      - { version: v1.35.9+rke2r1, verifiedWithProvider: v0.27.0, default: true }
      - { version: v1.34.12+rke2r1, verifiedWithProvider: v0.27.0 }
      - { version: v1.33.13+rke2r3, verifiedWithProvider: v0.27.0 }
  k0s:
    source:
      datasource: github-releases
      package: k0sproject/k0s
    verified: 2026-10-20
    note: Latest patch per minor from the k0sproject/k0s releases. k0smotron runs its e2e tests with v1.31 only; v1.34 and v1.35 were verified live in FP-9.
    versions:
      - { version: v1.36.4+k0s.1, verifiedWithProvider: v2.3.0, untested: true }
      - { version: v1.35.8+k0s.1, verifiedWithProvider: v2.3.0, default: true }
      - { version: v1.34.11+k0s.1, verifiedWithProvider: v2.3.0 }
      - { version: v1.33.13+k0s.1, verifiedWithProvider: v2.3.0 }
  kubeadm:
    source:
      datasource: github-releases
      package: kubernetes/kubernetes
    verified: 2026-10-18
    note: Checked against dl.k8s.io/release/stable-1.XX.txt and the pkgs.k8s.io deb and rpm repositories (FP10-F-02); Cluster API v1.14 supports v1.33 to v1.37 for kubeadm.
    versions:
      - { version: v1.37.1, verifiedWithProvider: v1.14.3 }
      - { version: v1.36.5, verifiedWithProvider: v1.14.3 }
      - { version: v1.35.9, verifiedWithProvider: v1.14.3, default: true }
      - { version: v1.34.12, verifiedWithProvider: v1.14.3 }
      - { version: v1.33.13, verifiedWithProvider: v1.14.3 }

# ---- Helm charts of the add-on presets (FP8-F-14) ------------------------------------------------
addonPresets:
  openstack-ccm:
    version: 2.37.1
    source:
      datasource: helm
      package: openstack-cloud-controller-manager
      registry: https://kubernetes.github.io/cloud-provider-openstack
    verified: 2026-10-17
    note: Released together with openstack-csi; keep both on the same version.
  openstack-csi:
    version: 2.37.1
    source:
      datasource: helm
      package: openstack-cinder-csi
      registry: https://kubernetes.github.io/cloud-provider-openstack
    verified: 2026-10-17
  aws-ccm:
    version: 0.0.12
    source:
      datasource: helm
      package: aws-cloud-controller-manager
      registry: https://kubernetes.github.io/cloud-provider-aws
    verified: 2026-10-17
  aws-csi:
    version: 2.67.0
    source:
      datasource: helm
      package: aws-ebs-csi-driver
      registry: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    verified: 2026-10-17
  kured:
    version: 6.1.0
    source:
      datasource: helm
      package: kured
      registry: https://kubereboot.github.io/charts
    verified: 2026-10-18

# ---- Node software installed by the app (kubeadm on stock images, ADR-0014) ---------------------
kubeadmRuntime:
  containerd:
    # Release binary; the checksum is downloaded and verified on the node at first boot.
    version: 2.4.2
    source:
      datasource: github-releases
      package: containerd/containerd
    verified: 2026-10-20
    note: >-
      containerd's compatibility table lists 2.4 for Kubernetes 1.37 and 2.3 for 1.36+; the older
      catalog minors run on it through CRI v1 as well. Its own runc pin is 1.5.2, like ours.
  runc:
    version: 1.5.2
    source:
      datasource: github-releases
      package: opencontainers/runc
    verified: 2026-10-18

# ---- Artifacts shipped with the app ---------------------------------------------------------------
cni:
  calico:
    # Manifest calico-vxlan.yaml, shipped in apps/backend/assets/calico and delivered by a
    # ClusterResourceSet to kubeadm clusters. A new version needs the new file and its checksum.
    version: v3.33.0
    source:
      datasource: github-releases
      package: projectcalico/calico
    verified: 2026-10-18
    manifest: calico-vxlan-v3.33.0.yaml
    sha256: 202d70b43e38b60ebc60736c96e64e6de683053aab2e89da84ea9d904a9ef24c

# Cloud controller manager and CSI driver for Google Cloud (FP25-F-08, ADR-0023): neither project
# publishes a Helm chart, so the manifests are shipped in apps/backend/assets/gcp, verified by their
# checksum and delivered by a ClusterResourceSet. A new version needs the new file and its checksum.
addonManifests:
  gcp-ccm:
    # deploy/packages/default/manifest.yaml of tag vX; the app sets the image to this version.
    version: v36.4.9
    source:
      datasource: docker
      package: cloud-provider-gcp/cloud-controller-manager
      registry: https://registry.k8s.io
    verified: 2026-10-20
    note: >-
      The repository has tags but no GitHub releases; the image follows the Kubernetes minor (v36 =
      1.36) and supports the minors around it. The manifest is meant for tooling (empty args, cloud
      config from the host); the app fills both (gcp-addons.ts).
    manifest: gcp-ccm-v36.4.9.yaml
    sha256: 46ffa27d31d17a8f7cbfbabefa61b6031def573763bb7be1b3bc0d5525e91970
  gcp-csi:
    # `kubectl kustomize deploy/kubernetes/overlays/noauth` of the release tag (images as pinned by
    # upstream's stable-master): no service account key, the controller uses the node's account.
    version: v1.27.5
    source:
      datasource: github-releases
      package: kubernetes-sigs/gcp-compute-persistent-disk-csi-driver
    verified: 2026-10-20
    manifest: gcp-pd-csi-noauth-v1.27.5.yaml
    sha256: 72d2f057d3d69bad407cea926e2de62d9ca4e19aef9a0c383e3d6c48500e9b22

# ---- Container images the app starts -------------------------------------------------------------
images:
  node-shell:
    # Privileged pod for the node shell (FP-17); NODE_SHELL_IMAGE / Helm nodeShell.image override it.
    version: '3.24'
    source:
      datasource: docker
      package: alpine
      registry: docker.io
    verified: 2026-10-20
  kube-vip:
    # Virtual IP for the API server on Proxmox VE (ARP mode, control plane only; FP31-F-07).
    version: v1.3.1
    source:
      datasource: docker
      package: kube-vip/kube-vip
      registry: ghcr.io
    verified: 2026-10-23
    note: >-
      Detects the interface itself when vip_interface is unset. Verified live with RKE2
      (in-cluster credentials) and k0s (node admin kubeconfig).

# ---- Local test setup (not shipped with the app) -------------------------------------------------
testTools:
  dex:
    # OpenID Connect provider for the FP-14 tests in kind (`pnpm dex:up`); Helm chart of Dex v2.46.0,
    # the first Dex with groups for static users.
    version: 0.26.0
    source:
      datasource: helm
      package: dex
      registry: https://charts.dexidp.io
    verified: 2026-10-20
  socat:
    # Forwards 127.0.0.1:5556 to the Dex NodePort in kind, so the browser and the backend reach
    # Dex under one issuer URL also with Docker Desktop (no route to the kind network).
    version: 1.8.1.1
    source:
      datasource: docker
      package: alpine/socat
      registry: docker.io
    verified: 2026-10-20
  gitleaks:
    # Secret scan of the whole Git history before pushing (`pnpm secrets:scan`, run in Docker).
    version: v8.30.1
    source:
      datasource: docker
      package: gitleaks/gitleaks
      registry: https://ghcr.io
    verified: 2026-10-22
