apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: capi-navigator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capi-navigator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        # The user "node" of the image; numeric, so runAsNonRoot can be verified.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: capi-navigator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NAVIGATOR_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: SESSION_TTL_HOURS
              value: {{ .Values.auth.sessionTtlHours | quote }}
            - name: AUDIT_RETENTION_DAYS
              value: {{ .Values.audit.retentionDays | quote }}
            {{- with .Values.nodeShell.image }}
            - name: NODE_SHELL_IMAGE
              value: {{ . | quote }}
            {{- end }}
            - name: API_DOCS_ENABLED
              value: {{ .Values.apiDocs.enabled | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.auth.cookieSecure | quote }}
            {{- with .Values.publicUrl }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- $trustProxy := .Values.trustProxy }}
            {{- if and (not $trustProxy) (or .Values.ingress.enabled .Values.httpRoute.enabled) }}
            {{- $trustProxy = "loopback,linklocal,uniquelocal" }}
            {{- end }}
            {{- with $trustProxy }}
            - name: TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
