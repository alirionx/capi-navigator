{{- /*
Home cluster access of the in-cluster service account (section 4, Operations).
Only the release namespace: the app's own CRDs, Secrets (password hashes, session key) and the
Lease used for audit cleanup. Remote management clusters use their own stored credentials (FP-2).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [navigator.capi-navigator.io]
    resources: [navigatorusers, navigatorroles, navigatortokens, auditevents, managementclusters, helmrepositories]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [navigator.capi-navigator.io]
    resources: [managementclusters/status, navigatortokens/status]
    verbs: [get, update, patch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, delete]
  # Add-on preset overrides (FP8-F-14)
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.homeClusterAsManagementCluster }}
---
# FP2-F-03: the home cluster itself as management cluster ("Home cluster" connection).
# cluster-admin, because installing ORC and providers (FP-3) creates CRDs and cluster RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-home-cluster-admin
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
