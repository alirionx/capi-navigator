{{- /*
Home cluster access of the in-cluster service account (section 4, Operations).
Only the release namespace: the app's own CRDs, Secrets (password hashes, session key) and the
Lease used for audit cleanup. Access to management clusters follows in FP-2.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [navigator.capi-navigator.io]
    resources: [navigatorusers, auditevents]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: capi-navigator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
