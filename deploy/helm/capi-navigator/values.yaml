image:
  repository: ghcr.io/alirionx/capi-navigator
  tag: ''
  pullPolicy: IfNotPresent

replicaCount: 1

# Exposure: the Service is always created; Ingress and HTTPRoute are optional and can be
# combined with it (e.g. type LoadBalancer for direct access plus an Ingress with TLS).
service:
  # ClusterIP (default), NodePort or LoadBalancer.
  type: ClusterIP
  port: 80
  annotations: {}
  # Only for type NodePort or LoadBalancer:
  nodePort: ''
  externalTrafficPolicy: ''
  # Only for type LoadBalancer:
  loadBalancerClass: ''
  loadBalancerIP: ''
  loadBalancerSourceRanges: []

# Ingress (networking.k8s.io/v1). TLS should terminate here: sessions use Secure cookies.
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts: []
  #  - capi-navigator.example.com
  path: /
  pathType: Prefix
  tls: []
  #  - secretName: capi-navigator-tls
  #    hosts: [capi-navigator.example.com]

# Gateway API HTTPRoute (gateway.networking.k8s.io/v1); needs an existing Gateway.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: shared-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  #  - capi-navigator.example.com
  path: /
  # Optional rule timeouts, e.g. { request: 0s } where the gateway would cut live updates (SSE).
  timeouts: {}

# Express "trust proxy" (TRUST_PROXY): which proxies may set X-Forwarded-For, needed for the
# client IP of the login rate limit. Empty: "loopback,linklocal,uniquelocal" when the Ingress or
# HTTPRoute is enabled, otherwise the app default "loopback".
trustProxy: ''

resources: {}

auth:
  # FP1-F-03: absolute session lifetime in hours.
  sessionTtlHours: 8
  # Secure flag of the session cookie (COOKIE_SECURE). Browsers only store it over HTTPS or on
  # localhost; set false only for plain-HTTP access in test setups (e.g. LoadBalancer without TLS).
  cookieSecure: true
  # FP1-F-02: the initial admin password is read from the Secret capi-navigator-initial-admin
  # (key "password") in the release namespace. If it does not exist, a random password is
  # generated into that Secret on first start.

# Public URL of the app, e.g. https://capi-navigator.example.com (PUBLIC_URL). Required for
# OpenID Connect: the redirect URI is <publicUrl>/api/auth/oidc/callback.
publicUrl: ''

# FP-14: sign-in with an OpenID Connect provider (Okta, Auth0, Dex, Keycloak, Rancher, ...), in
# addition to the local users. Access comes from the provider's groups, mapped to roles in the user
# management; see docs/oidc.md. Enabled when issuerUrl is set.
oidc:
  issuerUrl: ''
  clientId: ''
  # Secret in the release namespace with the client secret, e.g.
  #   kubectl create secret generic capi-navigator-oidc --from-literal=clientSecret=...
  existingSecret: capi-navigator-oidc
  existingSecretKey: clientSecret
  # Space-separated; e.g. add "groups" for Dex and Keycloak client scopes named so.
  scopes: openid profile email
  # Claim with the groups; Auth0 needs a namespaced claim such as https://capi-navigator/groups.
  groupsClaim: groups
  # Claim with the display name; falls back to email, then the subject.
  usernameClaim: preferred_username
  buttonLabel: Sign in with OIDC
  # Role for people without a mapped group; empty refuses them.
  defaultRole: viewer

audit:
  retentionDays: 90

# API documentation (FP-23): OpenAPI document at /api/openapi.json and Swagger UI at /api/docs,
# both reachable without sign-in (they describe the API, calling it still needs a session).
apiDocs:
  enabled: true

# Node shell (FP-17): image of the privileged pod; use a mirror in air-gapped setups.
nodeShell:
  # Empty: the version pinned by the app (versions.yaml, images.node-shell).
  image: ''

# FP2-F-03: allow using the home cluster itself as management cluster ("Home cluster"
# connection). Binds the app's service account to cluster-admin. Default: false.
homeClusterAsManagementCluster: false
